name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.14

      - name: Create venv & install dependencies
        run: |
          uv venv
          uv pip install numpy pandas matplotlib pyyaml pytest \
            pyvisa pyvisa-sim pyarrow scipy scikit-learn jinja2

      - name: Run unit tests
        run: uv run pytest -q

      - name: Run full pipeline (fixed seed, reproducible)
        run: uv run python main.py

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-ate-outputs
          path: outputs/
          retention-days: 14
